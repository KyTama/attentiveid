name: Build Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun run verify
      - run: ./scripts/ci/verify-runtime-config.sh
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kytama/attentiveid-web:${{ github.sha }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/kytama/attentiveid-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kytama/attentiveid-api:${{ github.sha }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/kytama/attentiveid-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Smoke test hardened images
        env:
          WEB_IMAGE: ghcr.io/kytama/attentiveid-web:${{ github.sha }}
          API_IMAGE: ghcr.io/kytama/attentiveid-api:${{ github.sha }}
        run: ./scripts/ci/smoke-images.sh
      - id: bundle
        run: |
          mkdir -p release
          ./scripts/deploy/package-release-bundle.sh --output "release/attentive-${GITHUB_SHA}" | tee release/bundle.env
          cat release/bundle.env >>"$GITHUB_OUTPUT"
      - run: |
          ./scripts/deploy/create-release-manifest.sh \
            --commit "$GITHUB_SHA" \
            --web-image "ghcr.io/kytama/attentiveid-web@${{ steps.web.outputs.digest }}" \
            --api-image "ghcr.io/kytama/attentiveid-api@${{ steps.api.outputs.digest }}" \
            --bundle-version "$GITHUB_SHA" \
            --bundle-sha256 "${{ steps.bundle.outputs.BUNDLE_SHA256 }}" \
            --output release/release.env
          ./scripts/ci/verify-release-manifest.sh release/release.env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.sha }}
          path: |
            release/attentive-${{ github.sha }}.tar.gz
            release/attentive-${{ github.sha }}.tar.gz.sha256
            release/release.env
          if-no-files-found: error
          retention-days: 30
