name: Promote Production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Deploy Staging workflow run ID
        required: true
        type: string
      commit_sha:
        description: Exact staged commit SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      RELEASE_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Validate promotion input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Verify successful staging source run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_json="$(mktemp)"
          trap 'rm -f "$run_json"' EXIT
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" >"$run_json"
          jq -e '
            .name == "Deploy Staging" and
            .event == "workflow_run" and
            .conclusion == "success" and
            .head_branch == "master"
          ' "$run_json" >/dev/null

      - name: Check out exact staged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Verify production readiness evidence
        run: ./scripts/ci/verify-environment-readiness.sh --evidence deploy/readiness/production.json

      - name: Download successful staging candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: staging-candidate-${{ inputs.commit_sha }}
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.staging_run_id }}

      - name: Verify staged provenance and release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/verify-release-manifest.sh release/release.env
          source release/release.env
          source release/staging-provenance.env
          [[ "$STAGING_WORKFLOW_RUN_ID" == "$STAGING_RUN_ID" ]]
          [[ "$COMMIT_SHA" == "$RELEASE_SHA" ]]
          [[ "$BUNDLE_VERSION" == "$RELEASE_SHA" ]]
          mapfile -t bundles < <(find release -maxdepth 1 -type f -name '*.tar.gz' -print)
          [[ "${#bundles[@]}" -eq 1 ]]
          bundle="${bundles[0]}"
          checksum="$bundle.sha256"
          [[ -f "$checksum" ]]
          [[ "$(awk '{ print $1 }' "$checksum")" == "$BUNDLE_SHA256" ]]
          [[ "$(sha256sum "$bundle" | awk '{ print $1 }')" == "$BUNDLE_SHA256" ]]
          printf 'bundle=%s\nchecksum=%s\nmanifest=%s\n' "$bundle" "$checksum" "release/release.env" >>"$GITHUB_OUTPUT"

      - name: Connect runner to tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_SSH_HOST }}

      - name: Prepare strict SSH identity
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/attentive-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/attentive-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$RUNNER_TEMP/attentive-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/attentive-ssh/id_ed25519" "$RUNNER_TEMP/attentive-ssh/known_hosts"

      - name: Promote exact staged release
        id: deploy
        run: |
          ./scripts/deploy/remote-deploy.sh \
            --host "${{ vars.DEPLOY_SSH_HOST }}" \
            --user "${{ vars.DEPLOY_SSH_USER }}" \
            --port "${{ vars.DEPLOY_SSH_PORT }}" \
            --identity "$RUNNER_TEMP/attentive-ssh/id_ed25519" \
            --known-hosts "$RUNNER_TEMP/attentive-ssh/known_hosts" \
            --bundle "${{ steps.release.outputs.bundle }}" \
            --checksum "${{ steps.release.outputs.checksum }}" \
            --manifest "${{ steps.release.outputs.manifest }}" \
            --environment production

      - name: Verify public production health
        id: public_health
        run: ./scripts/deploy/healthcheck.sh --web-url "${{ vars.PUBLIC_WEB_URL }}" --api-url "${{ vars.PUBLIC_API_URL }}"

      - name: Roll back previous production release
        if: failure() && (steps.deploy.outcome == 'failure' || steps.public_health.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/attentive-ssh/id_ed25519" \
            -p "${{ vars.DEPLOY_SSH_PORT }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/attentive-ssh/known_hosts" \
            "${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_SSH_HOST }}" \
            'previous=/opt/attentive/manifests/production/previous.env; [[ -f "$previous" ]] && /opt/attentive/current/scripts/deploy/rollback.sh --manifest "$previous" --root /opt/attentive'
