<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goal System Compass · Attentive</title>
<meta name="description" content="Petakan tujuan-tujuan Anda dan lihat bagaimana semuanya saling menggerakkan.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#06080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}

/* Layout: a living night sky fills the screen; one glass panel at a time sits over it (left on desktop, bottom on phones) so the stars stay visible. */
:root{
 --bg:#06080d;--ink:#f4ecde;--mute:rgba(244,236,222,.66);--dim:rgba(244,236,222,.45);--line:rgba(255,255,255,.1);--glass:rgba(11,14,21,.68);--glass2:rgba(255,255,255,.05);
 --gold:#d19d38;--gold2:#ecc77d;--sup:#e7c27a;--con:#ff7a5c;--amb:#93a8ff;--ok:#8fd3a8;--err:#ff8f7a;
 --sans:"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;--serif:"Source Serif 4","Iowan Old Style","Charter","Georgia",serif;
 color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:10px}
#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;touch-action:none}
.top{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:18px;padding:max(14px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));pointer-events:none;background:linear-gradient(rgba(6,8,13,.85),rgba(6,8,13,0))}
.brand{display:flex;align-items:center;gap:10px;pointer-events:auto;background:none;border:0;padding:0}
.brand b{font-weight:700;color:var(--gold);font-size:19px;letter-spacing:-.02em}
.brand span{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-left:6px}
.steps{margin-left:auto;display:flex;gap:6px;align-items:center}
.steps i{width:26px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .4s}
.steps i.on{background:var(--gold2)}
.lang{display:flex;pointer-events:auto;border:1px solid var(--line);border-radius:999px;padding:2px;background:rgba(11,14,21,.6)}
.steps:empty+.lang{margin-left:auto}
.lang button{background:none;border:0;color:var(--dim);font-size:11.5px;font-weight:700;letter-spacing:.08em;padding:5px 9px;border-radius:999px}
.lang button[aria-pressed=true]{background:var(--gold2);color:#14110b}
.devbar{position:fixed;z-index:8;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100vw - 24px);padding:6px;border-radius:14px;background:rgba(40,12,60,.9);border:1px dashed #c58cff;font-size:12px}
.devbar b{color:#e6c8ff;letter-spacing:.14em;font-size:10.5px;padding:0 6px}
.devbar button{background:#c58cff;color:#1a0b26;border:0;border-radius:999px;padding:6px 11px;font-weight:700;font-size:12px}
.devbar button[data-a=devReset]{background:transparent;color:#e6c8ff;border:1px solid #c58cff}
.devcode{width:100%;height:60px;font:11px monospace;background:#12081a;color:#e6c8ff;border:1px solid #c58cff;border-radius:8px}
.steps em{font-style:normal;font-size:12px;color:var(--dim);margin-right:8px;font-weight:600;letter-spacing:.04em}
.wrap{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;padding:96px max(20px,env(safe-area-inset-right,0px)) 48px max(20px,env(safe-area-inset-left,0px));pointer-events:none}
.panel{pointer-events:auto;width:min(540px,100%);margin-left:max(0px,5vw);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.25);backdrop-filter:blur(18px) saturate(1.25);border:1px solid var(--line);border-radius:26px;padding:clamp(22px,3.4vw,34px);box-shadow:0 30px 80px -30px rgba(0,0,0,.8);animation:rise .55s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.k{font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.005em}
h2.serif{font-size:clamp(27px,3.4vw,36px);line-height:1.15;margin:10px 0 8px}
p{margin:0}
.lead{color:var(--mute);font-size:15.5px}
.small{font-size:13px;color:var(--dim)}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--gold2);color:#1a1408;border:0;border-radius:999px;padding:15px 28px;font-weight:700;font-size:15.5px;transition:transform .15s,background .2s,opacity .2s;text-decoration:none}
.primary:hover:not(:disabled){background:#f3d394}.primary:active:not(:disabled){transform:scale(.98)}.primary:disabled{opacity:.35;cursor:default}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;transition:border-color .2s,background .2s}
.ghost:hover:not(:disabled){border-color:rgba(236,199,125,.6)}.ghost:disabled{opacity:.35;cursor:default}
.ghost.sm{padding:7px 13px;font-size:13px}
.link{background:none;border:0;padding:4px 0;color:var(--mute);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
/* landing */
.hero{pointer-events:auto;max-width:640px;margin-left:max(0px,5vw);display:flex;flex-direction:column;gap:18px;animation:rise .8s cubic-bezier(.2,.7,.2,1)}
.hero h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(40px,6.4vw,72px);line-height:1.04;letter-spacing:-.02em}
.hero h1 b{font-weight:400;color:var(--gold2)}
.hero .lead{font-size:17px;max-width:46ch}
.facts{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.facts li{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:rgba(0,0,0,.25)}
.resume{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:14px;color:var(--mute)}
/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.f input,.f select{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15.5px;width:100%;transition:border-color .2s}
.f select option{background:#11151e}
.f input:focus,.f select:focus{outline:none;border-color:var(--gold2)}
.f .err{font-size:12px;color:var(--err);min-height:0}
.f.bad input,.f.bad select{border-color:var(--err)}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{background:transparent;border:0;border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--gold2);color:#1a1408}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--mute);grid-column:1/-1;cursor:pointer}
.consent input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(255,255,255,.3);margin:1px 0 0;display:grid;place-items:center;cursor:pointer}
.consent input:checked{background:var(--gold2);border-color:var(--gold2)}
.consent input:checked::after{content:"";width:6px;height:11px;border:solid #1a1408;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* discover */
.meter{display:flex;align-items:center;gap:14px;margin-top:4px}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.deck{position:relative;height:230px;margin:18px 0 6px;touch-action:pan-y}
.card{position:absolute;inset:0;border-radius:22px;background:linear-gradient(160deg,#232a38,#141923);border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:24px;user-select:none;touch-action:none;cursor:grab;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.card.back{transform:scale(.94) translateY(12px);opacity:.4;pointer-events:none}
.card .area{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
.card .txt{font-family:var(--serif);font-style:italic;font-size:clamp(24px,3.2vw,30px);line-height:1.2;text-wrap:balance}
.card .hint{position:absolute;top:16px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;opacity:0;border:1.5px solid}
.card .hint.y{right:16px;color:var(--gold2);border-color:var(--gold2)}.card .hint.n{left:16px;color:var(--dim);border-color:var(--dim)}
.card.fly-y{transform:translate(120%,-30%) rotate(14deg) scale(.6);opacity:0}.card.fly-n{transform:translateX(-130%) rotate(-12deg);opacity:0}
.yn{display:flex;justify-content:center;gap:14px;margin-top:6px}
.yn button{flex:1;max-width:200px;padding:14px;border-radius:999px;font-weight:700;font-size:15px}
.yn .no{background:var(--glass2);border:1px solid var(--line);color:var(--mute)}
.yn .yes{background:var(--gold2);border:0;color:#1a1408}
.minirow{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;max-height:120px;overflow:auto}
.chip{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--glass2);border-radius:999px;padding:5px 6px 5px 12px;display:inline-flex;gap:4px;align-items:center;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{background:none;border:0;color:var(--dim);padding:0 6px;font-size:13px}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14.5px}
.add input:focus{outline:none;border-color:var(--gold2)}
.banner{margin-top:14px;font-size:13.5px;color:var(--mute);border:1px solid rgba(236,199,125,.35);background:rgba(236,199,125,.07);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* rank */
.pick{display:grid;gap:8px;margin-top:16px;max-height:min(46vh,430px);overflow:auto;padding-right:4px}
.pick button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14.5px;font-weight:500;transition:border-color .2s,background .2s}
.pick button .no{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.25);display:grid;place-items:center;font-size:13px;font-weight:700}
.pick button[aria-pressed="true"]{border-color:rgba(236,199,125,.55);background:rgba(236,199,125,.09)}
.pick button[aria-pressed="true"] .no{border:0;background:var(--gold2);color:#1a1408}
.pick button:disabled{opacity:.4}
/* status & connect rows */
.rows{display:grid;gap:8px;margin-top:16px;max-height:min(52vh,470px);overflow:auto;padding-right:4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 14px}
.row .nm{font-size:14.5px;font-weight:500;line-height:1.3}
.row .nm small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.row .seg{--n:3;min-width:258px}.row .seg button{font-size:12.5px;padding:7px 4px}
.cyc{min-width:142px;min-height:38px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13px;font-weight:700;color:var(--dim);padding:7px 14px;transition:background .2s,color .2s,border-color .2s,transform .12s}
.cyc:active{transform:scale(.96)}
.cyc[data-v="s"]{background:var(--sup);border-color:var(--sup);color:#1a1408}
.cyc[data-v="c"]{background:var(--con);border-color:var(--con);color:#1d0c07}
.cyc[data-v="b"]{background:var(--amb);border-color:var(--amb);color:#0b1030}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--dim);margin-top:10px}
.legend .cyc{min-width:0;min-height:0;padding:2px 9px;font-size:11px;pointer-events:none}
h2.serif em{font-style:italic;color:var(--gold2)}
/* result */
.find{display:grid;gap:10px;margin-top:18px}
.fc{border-radius:18px;padding:16px 18px;background:var(--glass2);border:1px solid var(--line);position:relative;overflow:hidden}
.fc::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--c)}
.fc .k{color:var(--c)}
.fc h3{font-size:17px;font-weight:600;margin:6px 0 4px;line-height:1.3}
.fc p{font-size:14px;color:var(--mute)}
.mail{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--mute);margin-top:16px}
.mail i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--dim)}
.mail.ok i{background:var(--ok)}.mail.err i{background:var(--err)}.mail.wait i{background:var(--gold2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.cta{margin-top:18px;border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.cta h3{font-size:18px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;text-decoration:none;color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:14px;transition:border-color .2s,transform .15s}
.opt:hover{border-color:rgba(236,199,125,.6);transform:translateY(-1px)}
.opt b{font-size:14.5px}.opt span{font-size:12.5px;color:var(--mute)}
.opt.main{background:rgba(236,199,125,.12);border-color:rgba(236,199,125,.45)}
.contact{font-size:13px;color:var(--dim)}
.contact b{color:var(--mute);font-weight:600;user-select:all}
details.prev{margin-top:14px;font-size:13px;color:var(--mute)}
details.prev summary{cursor:pointer;font-weight:600}
.mailprev{margin-top:10px;background:#f6f1e7;color:#2b3346;border-radius:14px;padding:16px;font-size:13.5px;line-height:1.55}
.mailprev b{color:#2b3346}
.tip{position:fixed;z-index:4;pointer-events:none;max-width:260px;background:rgba(11,14,21,.86);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mute);transform:translate(-50%,calc(-100% - 18px));opacity:0;transition:opacity .2s}
.tip b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
.toast{position:fixed;z-index:9;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,24,33,.95);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;animation:rise .3s;max-width:calc(100vw - 32px);text-align:center}
.foot{position:relative;z-index:2;text-align:center;font-size:12px;color:var(--dim);padding:0 16px 22px;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}


/* goals step: writing first, cards as help */
.add.big{margin-top:14px}.add.big input{padding:14px 18px;font-size:16px;border-color:rgba(236,199,125,.45);background:rgba(255,255,255,.08)}
.primary.sm{padding:11px 18px;font-size:14px}
.ex{margin-top:8px;font-style:italic}.src{margin-top:6px}
.chip.own{border-color:rgba(236,199,125,.45)}
.stuck{margin-top:14px;width:100%;text-align:left;display:flex;flex-direction:column;gap:3px;background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.22);border-radius:16px;padding:12px 16px;color:var(--ink)}
.stuck b{font-size:14px}.stuck span{font-size:12.5px;color:var(--dim)}.stuck:hover{border-color:rgba(236,199,125,.6)}
.minbar{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap}.minbar i{width:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}.minbar i.on{background:var(--gold2)}.minbar span{font-size:12.5px;color:var(--dim);margin-left:6px}
.minok{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;font-weight:600;color:var(--gold2);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.minok span{width:20px;height:20px;border-radius:50%;background:var(--gold2);color:#1a1408;display:grid;place-items:center;font-size:12px;box-shadow:0 0 18px rgba(236,199,125,.8)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.rankhead{margin-top:10px}
.cx{margin-top:14px;border-radius:14px;padding:10px 14px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.cxh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:12.5px}.cxh b{font-weight:700}.cxh span{color:var(--dim)}
.cxb{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}.cxb i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .4s}.cx.lv1 .cxb i{background:var(--gold2)}.cx.lv2 .cxb i{background:var(--con)}
.cx p{font-size:12.5px;color:var(--mute);margin-top:8px}
.cx.lv0 b{color:var(--ok)}.cx.lv1{border-color:rgba(236,199,125,.45)}.cx.lv1 b{color:var(--gold2)}.cx.lv2{border-color:rgba(255,122,92,.5);background:rgba(255,122,92,.06)}.cx.lv2 b{color:var(--con)}
/* roles */
.ri{flex:none;display:inline-block;width:14px;height:14px;border-radius:50%;position:relative}
.ri.trouble{background:radial-gradient(#ffd2c6,#ff6046 55%,rgba(255,96,70,0) 72%);box-shadow:0 0 0 2px rgba(255,96,70,.35),0 0 10px #ff6046}
.ri.driver{background:radial-gradient(#fff6e4,#ecc77d 55%,rgba(236,199,125,0) 72%);box-shadow:0 0 0 3px rgba(236,199,125,.18),0 0 0 6px rgba(236,199,125,.08)}
.ri.squeezed{background:radial-gradient(#e6fbff,#78dceb 55%,rgba(120,220,235,0) 72%);box-shadow:inset 0 0 0 2px rgba(120,220,235,.7)}
.ri.hub{background:radial-gradient(#fff,#f4ecde 50%,rgba(244,236,222,0) 70%);outline:1.5px solid rgba(255,240,214,.8);outline-offset:3px;border-radius:50%}
.ri.iso{background:#8a8a96;opacity:.7;outline:1.5px dashed #8a8a96;outline-offset:2px}
.ri.neutral{background:radial-gradient(#fff,#cfc6b4 55%,rgba(207,198,180,0) 72%)}
.roles{margin-top:16px;border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--glass2)}
.roles ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.roles li{display:flex;gap:12px;align-items:flex-start}.roles li .ri{margin-top:3px}
.roles li b{display:block;font-size:13.5px}.roles li span{font-size:12.5px;color:var(--dim)}
.roles li p{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.roles li p button{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink)}

/* ============ v16 · one stage ============
   The sky fills the screen and is the stage. Content lives in one compact dock at the bottom centre,
   so the stars are always born right above where the person is answering. Result = the map first. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
.foot{display:none}
.wrap{position:fixed;inset:0;z-index:2;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:72px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
#ui{display:flex;flex-direction:column;align-items:center;width:100%;min-height:0;max-height:100%}
.dock{pointer-events:auto;width:min(560px,100%);max-height:44vh;overflow:auto;overscroll-behavior:contain;background:rgba(10,13,20,.74);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:24px;padding:20px 22px 0;box-shadow:0 30px 80px -30px rgba(0,0,0,.85);animation:rise .5s cubic-bezier(.2,.7,.2,1);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.dock.list{max-height:50vh}.dock.tall{max-height:min(80vh,660px)}
.dock h2.serif{font-size:clamp(23px,2.3vw,28px);margin:0 0 4px}
.dock .lead{font-size:14.5px}.dock>.k{margin-bottom:6px}
.dock .nav{position:sticky;bottom:0;z-index:2;margin:14px -22px 0;padding:12px 22px 16px;background:linear-gradient(rgba(10,13,20,0),rgba(12,15,22,.96) 34%);flex-wrap:nowrap}
.dock .form .nav{grid-column:1/-1}
.form{margin-top:14px;gap:12px}
.f input,.f select{padding:11px 13px;font-size:15px}
.consent{font-size:12.5px}
.err{font-size:12px;color:var(--err)}
.qhead{display:flex;gap:14px;align-items:center}
.qhead .lead{margin-top:2px}
.ring{width:50px;height:50px}.ring b{font-size:16px}
.ring.ok b{color:var(--gold2);font-size:20px}
.ring.ok svg{filter:drop-shadow(0 0 6px rgba(236,199,125,.7))}
.ring.pop{animation:ringpop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes ringpop{0%{transform:scale(.7)}50%{transform:scale(1.18)}100%{transform:none}}
.add{margin-top:14px}.add input{padding:13px 16px;font-size:15.5px;border-color:rgba(236,199,125,.4);background:rgba(255,255,255,.07)}
.primary.sm{padding:11px 18px;font-size:14px}
.chips{max-height:none;overflow:visible;margin-top:12px}
.chip.own{border-color:rgba(236,199,125,.4)}
.deck{height:190px;margin:16px 0 6px}
.rows,.pick{max-height:none;overflow:visible;padding-right:0;margin-top:14px}
.cx{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:5px 10px;border:1px solid;white-space:nowrap;margin:0 auto;padding:5px 10px}
.cx.lv1{color:var(--gold2);border-color:rgba(236,199,125,.5);background:rgba(236,199,125,.08)}
.cx.lv2{color:var(--con);border-color:rgba(255,122,92,.55);background:rgba(255,122,92,.1)}
.cx::before,.cx p,.cxh,.cxb{display:none}
/* connect: one tap per answer */
.tri{display:flex;gap:4px}
.tri button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--dim);transition:background .15s,color .15s,transform .12s}

.tri .c[aria-pressed=true]{background:var(--con);border-color:var(--con);color:#1d0c07}
.tri .b[aria-pressed=true]{background:var(--amb);border-color:var(--amb);color:#0b1030}
.row .nm{font-size:14px}
/* landing */
.hero{pointer-events:auto;width:min(640px,100%);max-width:none;margin:0 auto 5vh;text-align:center;align-items:center;gap:16px}

.rtop{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:70px;right:70px;text-align:center;pointer-events:none;z-index:2}

.rtop .mail.ok{color:var(--ok)}.rtop .mail.err{color:var(--err)}
.rdock{pointer-events:auto;width:min(980px,100%);display:flex;flex-direction:column;gap:10px;animation:rise .7s .5s cubic-bezier(.2,.7,.2,1) both}

.rdock .fc .why{font-size:13px;color:var(--mute);line-height:1.45}.rdock .fc .why.big{font-size:14px;color:var(--ink)}
.rdock button.fc{cursor:pointer;transition:border-color .2s,transform .15s}.rdock button.fc:hover{border-color:rgba(255,255,255,.3);border-left-color:var(--c);transform:translateY(-2px)}
.acts{display:flex;gap:8px;justify-content:center}

.ghost.icon{width:50px;height:50px;padding:0;font-size:20px;flex:none}
body.result .devbar{right:auto;left:max(12px,env(safe-area-inset-left,0px))}
#mapui{z-index:6}
.mtools{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(62px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}

.mtools .pop{position:absolute;right:48px;top:46px;display:flex;flex-direction:column;align-items:stretch;gap:6px;background:rgba(10,13,20,.92);border:1px solid var(--line);border-radius:16px;padding:8px;width:max-content;animation:rise .2s}
.insp{right:64px;top:calc(62px + env(safe-area-inset-top,0px));bottom:20px;width:320px}
.insp .grp>p{margin-bottom:6px}
.sent{display:flex;gap:10px;align-items:center;font-size:14px}.sent .ln{flex:none}
/* sticky question at the top of a scrolling dock */
.dhead{position:sticky;top:-20px;z-index:3;margin:-20px -22px 0;padding:20px 22px 10px;background:linear-gradient(rgba(12,15,22,.97) 78%,rgba(12,15,22,0));border-radius:24px 24px 0 0}

/* values step */
.instr{font-size:13.5px;line-height:1.6;color:var(--mute);margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}

 const m=S.step;document.body.dataset.step=m;const cr=m===5?Object.fromEntries(analyze(data()).cent.map(x=>[x.id,x.pos])):S.rank,spo=m===5?{spiral:spiralObj()}:{};Sky.set({mode:m===0?'landing':m===5?'result':'ambient',...spo,rank:cr,prog:S.prog,map:m===5?S.map:[],rel:S.rel,focal:null,pair:null,...(m===5?(()=>{const B=brief(data());return {lever:null,pressure:null}})():{})});

function back(){const s=S.step;if(s===4){const A=analyze(data());if(S.qi>A.order.length)S.qi=A.order.length;if(S.qp===1){S.qp=0;draw();return}if(S.qi>0){S.qi--;S.qp=askH(A,A.order[S.qi])?1:0;draw();return}go(3);return}if(s===5){S.qi=analyze(data()).order.length;S.qp=0;go(4);return}go(Math.max(0,s-1))}

 case 'toRank':go(3);break;

 case 'win':{const L=bracket();if(L.done)break;const [x,y]=L.pair,k=ckey(x,y);S.cmp[k]=b.dataset.id;S.cmpLog.push(k);S.order=null;const L2=bracket();if(L2.done){ui.pop=true;Sky.celebrate&&Sky.celebrate(.6);toast(tr('🏆 Juara turnamen sudah ada.','🏆 You have a winner.'))}draw();break}
 case 'setCore':{const o=standings().slice(),id=b.dataset.id;S.order=[id,...o.filter(x=>x!==id)];ui.swap=false;draw();toast(tr('Inti diganti.','Core changed.'));break}

 case 'tap':{const A=analyze(data()),outQ=S.qi>=A.order.length,T=outQ?A.core:A.order[S.qi],k=outQ?T+'>'+b.dataset.id:b.dataset.id+'>'+T,want=outQ||(S.qp||0)===0?'s':'c';if(S.rel[k]===want)delete S.rel[k];else S.rel[k]=want;b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on'));b.classList.remove('rip');void b.offsetWidth;b.classList.add('rip');const mm=$('.mm');if(mm)mm.outerHTML=miniMap();save();break}

{const q=(location.search.match(/[?&]lang=(id|en)/)||[])[1],h=location.hash==='#en'?'en':location.hash==='#id'?'id':null;LANG=q||h||store.get(LKEY)||'id';document.documentElement.lang=LANG}
