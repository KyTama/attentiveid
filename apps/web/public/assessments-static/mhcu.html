  :root {
    --navy:#142B51; --navy-2:#1D3B6C; --navy-50:#EEF2F8; --gold:#D19E3A; --gold-50:#FBF5E8;
    --ink:#1B2533; --ink-2:#3C4858; --mute:#6B7686; --line:#DCE2EA; --line-2:#EBEFF4; --bg:#F3F5F8; --card:#FFFFFF;
    --alert:#B42318; --alert-50:#FEF3F2; --ok:#1E6B42; --ok-50:#ECF6F0; --r:10px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.6 'Montserrat', 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing:antialiased; font-feature-settings:'lnum' 1, 'tnum' 1; }
  a { color:var(--navy); font-weight:600; }
  button, input, select { font-family:inherit; }
  /* ---------- header ---------- */
  .hd { position:sticky; top:0; z-index:30; background:var(--card); border-bottom:1px solid var(--line); }
  .hd .in { max-width:980px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:14px; }
  .brand { display:flex; align-items:center; gap:11px; flex:1; min-width:0; }
  .brand img.lockup { height:30px; width:auto; flex:none; display:block; }
  .brand .nm { font-weight:700; font-size:17px; letter-spacing:-.2px; color:var(--navy); line-height:1.1; }
  .brand .sub { font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--mute); font-weight:600; }
  .brand .div { width:1px; height:30px; background:var(--line); margin:0 4px; }
  .brand .doc { font-size:12.5px; color:var(--ink-2); font-weight:600; line-height:1.25; }
  .brand .doc small { display:block; font-weight:500; color:var(--mute); font-size:11px; }
  .lang { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:none; }
  .lang button { border:0; background:#fff; color:var(--mute); font-weight:700; font-size:12px; letter-spacing:.6px; padding:8px 12px; cursor:pointer; }
  .lang button.on { background:var(--navy); color:#fff; }
  .bar { height:3px; background:var(--line-2); } .bar i { display:block; height:100%; width:0; background:var(--navy); transition:width .35s; }
  .gold-rule { height:2px; background:var(--gold); }
  /* ---------- layout ---------- */
  main { max-width:980px; margin:0 auto; padding:24px 20px 40px; }
  .stepper { display:flex; gap:0; margin:0 0 20px; overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:#fff; }
  .stepper div { flex:1; min-width:96px; padding:9px 10px; font-size:11.5px; font-weight:600; color:var(--mute); border-right:1px solid var(--line-2); white-space:nowrap; display:flex; gap:7px; align-items:center; }
  .stepper div:last-child { border-right:0; }
  .stepper b { display:inline-flex; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); align-items:center; justify-content:center; font-size:10.5px; flex:none; }
  .stepper .on { color:var(--navy); background:var(--navy-50); } .stepper .on b { background:var(--navy); border-color:var(--navy); color:#fff; }
  .stepper .done { color:var(--ink-2); } .stepper .done b { background:var(--ok-50); border-color:var(--ok); color:var(--ok); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:26px 28px; margin:0 0 16px; }
  .eyebrow { font-size:11px; letter-spacing:1.8px; text-transform:uppercase; color:var(--mute); font-weight:700; margin:0 0 8px; }
  h1 { font-size:26px; line-height:1.25; font-weight:700; letter-spacing:-.4px; margin:0 0 10px; color:var(--navy); }
  h2 { font-size:19px; line-height:1.3; font-weight:700; margin:0 0 6px; color:var(--navy); letter-spacing:-.2px; }
  h3 { font-size:14px; font-weight:700; margin:20px 0 6px; color:var(--navy); }
  p { margin:0 0 10px; } .lead { color:var(--ink-2); font-size:15.5px; } .muted { color:var(--mute); font-size:13.5px; } .small { font-size:12.5px; }
  .facts { display:grid; grid-template-columns:repeat(3, 1fr); gap:0; border:1px solid var(--line); border-radius:var(--r); margin:18px 0 6px; overflow:hidden; }
  .facts div { padding:14px 16px; border-right:1px solid var(--line-2); border-bottom:1px solid var(--line-2); display:flex; gap:11px; align-items:flex-start; }
  .facts svg { width:20px; height:20px; flex:none; stroke:var(--navy); fill:none; stroke-width:1.7; margin-top:2px; }
  .facts dt { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--mute); font-weight:700; }
  .facts dd { margin:2px 0 0; font-weight:600; font-size:14px; color:var(--ink); line-height:1.35; }
  .note { border:1px solid var(--line); border-left:3px solid var(--navy); background:#FAFBFD; border-radius:0 var(--r) var(--r) 0; padding:12px 16px; font-size:13.5px; color:var(--ink-2); margin:14px 0 0; }
  .note.alert { border-left-color:var(--alert); background:var(--alert-50); color:#5C1A14; }
  .note b { color:inherit; }
  .pricebox { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:var(--r); margin:16px 0 4px; overflow:hidden; }
  .pricebox div { padding:13px 16px; } .pricebox div + div { border-left:1px solid var(--line-2); }
  .pricebox small { display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--mute); font-weight:700; }
  .pricebox b { font-size:17px; color:var(--navy); } .pricebox s { color:#98A2B3; font-size:13px; margin-left:6px; } .pricebox em { font-style:normal; display:block; font-size:12px; color:var(--mute); margin-top:1px; }
  ol.next { margin:8px 0 0; padding:0; list-style:none; counter-reset:n; }
  ol.next li { counter-increment:n; position:relative; padding:0 0 12px 38px; font-size:14px; color:var(--ink-2); }
  ol.next li::before { content:counter(n); position:absolute; left:0; top:0; width:24px; height:24px; border-radius:50%; background:var(--navy-50); color:var(--navy); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; }
  ol.next li b { color:var(--ink); display:block; font-weight:600; }
  /* ---------- consent document ---------- */
  .icdoc { border:1px solid var(--line); border-radius:var(--r); background:#FCFCFD; max-height:56vh; overflow:auto; padding:22px 26px; font-size:14px; color:var(--ink-2); line-height:1.65; }
  .icdoc h4 { font-size:13.5px; color:var(--navy); margin:18px 0 4px; font-weight:700; display:flex; gap:8px; }
  .icdoc h4:first-child { margin-top:0; } .icdoc h4 span { color:var(--mute); font-weight:600; min-width:20px; }
  .icdoc p, .icdoc ul { margin:0 0 8px; } .icdoc ul { padding-left:20px; } .icdoc li { margin:2px 0; }
  .icdoc .end { text-align:center; font-size:12px; color:var(--mute); border-top:1px dashed var(--line); padding-top:10px; margin-top:16px; }
  .readhint { font-size:12.5px; color:var(--mute); margin:8px 0 0; display:flex; gap:8px; align-items:center; }
  .readhint i { flex:1; height:4px; border-radius:2px; background:var(--line-2); overflow:hidden; } .readhint i em { display:block; height:100%; width:0; background:var(--navy); }
  .checks { margin:18px 0 0; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  .checks.locked { opacity:.5; pointer-events:none; }
  .ck { display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-bottom:1px solid var(--line-2); cursor:pointer; font-size:14px; color:var(--ink-2); }
  .ck:last-child { border-bottom:0; } .ck:hover { background:#FAFBFD; }
  .ck input { width:18px; height:18px; margin:2px 0 0; accent-color:var(--navy); flex:none; }
  .ck.miss { background:var(--alert-50); }
  .group-t { font-size:12px; letter-spacing:1px; text-transform:uppercase; font-weight:700; color:var(--mute); padding:12px 16px 4px; background:#FAFBFD; border-bottom:1px solid var(--line-2); }
  /* ---------- fields ---------- */
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:4px 18px; }
  .fields .full { grid-column:1 / -1; }
  label.lb { display:block; font-weight:600; font-size:13.5px; margin:14px 0 6px; color:var(--ink); }
  label.lb small { font-weight:500; color:var(--mute); } label.lb .req { color:var(--alert); }
  input.t { width:100%; font-size:15px; padding:11px 13px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); transition:border-color .15s, box-shadow .15s; }
  input.t:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(20,43,81,.10); }
  input.t.bad { border-color:var(--alert); }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg label { position:relative; flex:1; text-align:center; padding:11px 8px; font-size:14px; font-weight:600; color:var(--ink-2); cursor:pointer; border-right:1px solid var(--line); background:#fff; }
  .seg label:last-child { border-right:0; } .seg input { position:absolute; opacity:0; }
  .seg label.sel { background:var(--navy); color:#fff; }
  .err { color:var(--alert); font-size:12.5px; margin-top:5px; display:none; font-weight:500; } .err.show { display:block; }
  .hp { position:absolute; left:-9999px; }
  /* ---------- questionnaire matrix ---------- */
  .instr { display:grid; grid-template-columns:1fr auto; gap:6px 20px; align-items:start; }
  .instr .period { border:1px solid var(--line); border-radius:8px; padding:8px 12px; text-align:right; white-space:nowrap; }
  .instr .period small { display:block; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--mute); font-weight:700; }
  .instr .period b { font-size:14px; color:var(--navy); }
  .mxwrap { background:#fff; border:1px solid var(--line); border-radius:var(--r); overflow:clip; }
  table.mx { width:100%; border-collapse:separate; border-spacing:0; }
  .mx thead th { position:sticky; top:var(--hdh, 60px); z-index:5; background:#F7F9FB; border-bottom:1px solid var(--line); font-size:11.5px; line-height:1.3; font-weight:700; color:var(--ink-2); padding:11px 6px; text-align:center; vertical-align:bottom; }
  .mx thead th small { display:block; font-weight:500; color:var(--mute); font-size:10.5px; margin-top:2px; }
  .mx thead th.st { text-align:left; padding-left:16px; } .mx thead th .v { display:block; font-size:13px; color:var(--navy); margin-bottom:2px; }
  .mx td { border-bottom:1px solid var(--line-2); padding:10px 6px; vertical-align:middle; }
  .mx tbody tr:last-child td { border-bottom:0; }
  .mx td.n { width:44px; text-align:right; color:var(--mute); font-weight:600; font-size:13px; padding-left:12px; }
  .mx td.st { font-size:14px; color:var(--ink); padding-right:14px; }
  .mx td.o { text-align:center; width:var(--ow, 92px); }
  .mx tbody tr:hover td { background:#FAFBFD; }
  .mx tr.ok td.n { color:var(--ok); }
  .mx tr.miss td { background:var(--alert-50) !important; } .mx tr.miss td.n { color:var(--alert); box-shadow:inset 3px 0 0 var(--alert); }
  .mx label.r { display:inline-flex; cursor:pointer; padding:4px; border-radius:50%; }
  .mx label.r input { position:absolute; opacity:0; pointer-events:none; }
  .mx label.r .dot { width:30px; height:30px; border-radius:50%; border:1.5px solid #B8C2CF; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--mute); background:#fff; transition:all .12s; }
  .mx label.r:hover .dot { border-color:var(--navy); color:var(--navy); }
  .mx label.r input:checked + .dot { background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700; }
  .mx label.r input:focus-visible + .dot { box-shadow:0 0 0 3px rgba(209,158,58,.6); }
  .mx .lbl { display:none; }
  .legend-m { display:none; }
  /* ---------- review ---------- */
  table.rv { width:100%; border-collapse:collapse; font-size:14px; }
  .rv td { padding:10px 4px; border-bottom:1px solid var(--line-2); } .rv td:last-child { text-align:right; }
  .rv .okc { color:var(--ok); font-weight:700; } .rv .bdc { color:var(--alert); font-weight:700; }
  .rv button { border:0; background:none; color:var(--navy); font-weight:700; cursor:pointer; font-size:13px; text-decoration:underline; }
  dl.kv { display:grid; grid-template-columns:170px 1fr; gap:6px 14px; margin:8px 0 0; font-size:14px; } dl.kv dt { color:var(--mute); } dl.kv dd { margin:0; font-weight:600; }
  /* ---------- nav ---------- */
  .nav { position:sticky; bottom:0; z-index:20; margin-top:6px; background:rgba(243,245,248,.94); backdrop-filter:blur(6px); border-top:1px solid var(--line); }
  .nav .in { max-width:980px; margin:0 auto; padding:12px 20px; display:flex; gap:12px; align-items:center; }
  .nav .count { flex:1; font-size:13px; color:var(--mute); font-weight:500; text-align:center; }
  .btn { border:1px solid transparent; font-weight:700; font-size:14px; letter-spacing:.2px; padding:12px 22px; border-radius:8px; cursor:pointer; min-width:120px; }
  .btn.pri { background:var(--navy); color:#fff; } .btn.pri:hover { background:var(--navy-2); }
  .btn.sec { background:#fff; color:var(--navy); border-color:var(--line); } .btn.sec:hover { border-color:var(--navy); }
  .btn[disabled] { opacity:.55; cursor:not-allowed; }
  .link { border:0; background:none; color:var(--mute); text-decoration:underline; cursor:pointer; font-size:12.5px; padding:0; }
  .toast { position:fixed; left:50%; top:86px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13.5px; display:none; z-index:40; max-width:90vw; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .receipt { border:1px solid var(--line); border-radius:var(--r); display:grid; grid-template-columns:repeat(3,1fr); margin:16px 0; }
  .receipt div { padding:12px 16px; border-right:1px solid var(--line-2); } .receipt div:last-child { border-right:0; }
  .receipt small { display:block; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--mute); font-weight:700; } .receipt b { font-size:14px; word-break:break-all; }
  .tick { width:46px; height:46px; border-radius:50%; background:var(--ok-50); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .tick svg { width:24px; height:24px; stroke:var(--ok); stroke-width:2.4; fill:none; }
  footer { max-width:980px; margin:0 auto; padding:6px 20px 28px; color:var(--mute); font-size:12px; display:flex; flex-wrap:wrap; gap:6px 18px; justify-content:space-between; }
  .demo { display:flex; gap:6px; } .demo button { border:1px dashed var(--gold); background:var(--gold-50); color:#7A5A14; font-weight:700; font-size:12px; padding:8px 10px; border-radius:8px; cursor:pointer; }
  .demo-tag { position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:50; background:var(--gold); color:var(--navy); font-size:11px; font-weight:700; letter-spacing:1px; padding:3px 10px; border-radius:0 0 8px 8px; }
  .hide { display:none !important; }
  @media (max-width:760px) {
    body { font-size:14.5px; } main { padding:16px 12px 30px; } .card { padding:20px 18px; } h1 { font-size:22px; }
    .brand .div, .brand .doc { display:none; } .brand .sub { display:none; }
    .facts, .receipt { grid-template-columns:1fr 1fr; } .fields { grid-template-columns:1fr; } dl.kv { grid-template-columns:1fr; gap:0 0; } dl.kv dd { margin-bottom:8px; }
    .instr { grid-template-columns:1fr; } .instr .period { text-align:left; }
    .stepper div { min-width:auto; } .stepper div span { display:none; } .stepper div.on span { display:inline; }
    /* matrix -> compact rows; the scale stays visible in a sticky legend */
    .mx thead { display:none; }
    .mx, .mx tbody, .mx tr { display:block; width:100%; }
    .mx tr { padding:12px 14px 10px; border-bottom:1px solid var(--line-2); }
    .mx td { display:inline-block; border:0; padding:0; background:none !important; }
    .mx td.n { width:auto; text-align:left; padding:0 6px 0 0; font-size:13px; vertical-align:top; }
    .mx td.st { width:calc(100% - 30px); padding:0 0 8px; vertical-align:top; }
    .mx tr.miss { background:var(--alert-50); box-shadow:inset 3px 0 0 var(--alert); } .mx tr.miss td.n { box-shadow:none; }
    .mx td.o { width:20%; }
    .mx label.r .dot { width:36px; height:36px; font-size:13px; }
    .legend-m { display:block; position:sticky; top:var(--hdh, 56px); z-index:6; background:#F7F9FB; border-bottom:1px solid var(--line); padding:8px 12px; font-size:11.5px; color:var(--ink-2); line-height:1.45; }
    .legend-m b { color:var(--navy); }
    .btn { min-width:0; padding:12px 16px; } .nav .count { font-size:12px; }
  }
  /* paid report hidden until the payment gateway is live: remove this rule to show the price box again */
  #pricebox { display:none !important; }
  /* long names and e-mail addresses wrap on the review step instead of pushing the page sideways */
  dl.kv > *, .rv td { min-width:0; overflow-wrap:anywhere; }
  /* keyboard focus is clearly visible, and a focused input is not left behind the sticky bottom bar */
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  html { scroll-padding-bottom:96px; }
</style>
</head>

id: [
 ['Tujuan pemeriksaan','Mental Health Check-Up (MHCU) adalah pemeriksaan skrining untuk memberikan gambaran umum kondisi kesehatan mental Anda. MHCU membantu Anda dan psikolog mengenali area yang sudah berjalan baik dan area yang mungkin memerlukan perhatian atau pemeriksaan lebih lanjut.'],
 ['Penyelenggara','MHCU diselenggarakan oleh Biro Psikologi Attentive (Attentive Psychology Bureau). Laporan lengkap disusun dan ditandatangani oleh psikolog Attentive yang terdaftar resmi di HIMPSI JAYA, dan nama psikolog tersebut tercantum pada laporan.'],
 ['Apa yang akan Anda lakukan','Anda akan mengisi data diri singkat dan 58 pernyataan dalam empat bagian: keluhan psikologis, kesejahteraan mental, perilaku sehat sehari-hari, dan gambaran diri. Pengisian membutuhkan waktu sekitar 10-15 menit. Tidak ada jawaban benar atau salah; jawablah dengan jujur sesuai pengalaman Anda sendiri.'],
 ['Sifat hasil: skrining, bukan diagnosis','MHCU adalah alat skrining berbasis laporan diri. Hasilnya bukan diagnosis klinis dan tidak menggantikan pemeriksaan oleh psikolog, psikiater, atau dokter. Hasil menggambarkan kondisi pada periode yang dinilai dan dapat berubah dari waktu ke waktu. Interpretasi akhir dilakukan oleh psikolog dengan mempertimbangkan informasi lain, seperti wawancara.'],
 ['Kesukarelaan dan hak untuk berhenti','Keikutsertaan Anda sepenuhnya sukarela. Anda boleh berhenti kapan saja sebelum mengirim jawaban, tanpa perlu memberikan alasan dan tanpa konsekuensi apa pun. Jawaban yang belum dikirim tidak disimpan di sistem kami; jawaban sementara hanya tersimpan di perangkat Anda agar tidak hilang, dan dapat Anda hapus melalui tautan "Hapus isian di perangkat ini" di bagian bawah halaman.'],
 ['Kemungkinan ketidaknyamanan','Sebagian pernyataan menanyakan hal yang bersifat pribadi, misalnya suasana hati, kecemasan, pikiran untuk menyakiti diri sendiri, pengalaman yang tidak biasa, serta penggunaan alkohol, rokok, atau obat-obatan. Menjawab pernyataan tersebut dapat memunculkan perasaan tidak nyaman. Anda boleh beristirahat sejenak, berhenti, atau menghubungi kami untuk berbicara dengan psikolog.'],
 ['Manfaat','Anda akan memperoleh gambaran ringkas tentang kondisi kesehatan mental Anda, rekomendasi tindak lanjut dari psikolog, dan, bila Anda mengikuti MHCU lebih dari sekali, perbandingan hasil dari waktu ke waktu. MHCU tidak menjamin perubahan kondisi dan bukan merupakan layanan terapi.'],
 ['Kerahasiaan dan batasannya','Seluruh informasi dijaga kerahasiaannya sesuai Kode Etik Psikologi Indonesia. Data identitas dan jawaban Anda hanya dapat diakses oleh psikolog dan staf administrasi Attentive yang berwenang, untuk keperluan layanan Anda. Kerahasiaan memiliki batas: apabila jawaban Anda menunjukkan kemungkinan risiko serius terhadap keselamatan Anda atau orang lain, psikolog Attentive dapat menghubungi Anda secara langsung melalui nomor atau email yang Anda berikan untuk memastikan keselamatan Anda dan menawarkan bantuan. Pengungkapan kepada pihak lain hanya dilakukan bila diwajibkan oleh hukum atau dalam keadaan darurat untuk melindungi keselamatan jiwa.'],
 ['Penyimpanan dan perlindungan data','Data dikirim melalui koneksi terenkripsi dan disimpan dalam sistem penyimpanan Google Workspace milik Attentive dengan akses terbatas. Data disimpan selama diperlukan untuk layanan, pemantauan hasil Anda dari waktu ke waktu, dan pemenuhan kewajiban profesi, lalu dihapus atau dianonimkan sesuai kebijakan retensi Attentive. Sesuai Undang-Undang No. 27 Tahun 2022 tentang Pelindungan Data Pribadi, Anda berhak meminta akses, perbaikan, atau penghapusan data Anda, serta menarik persetujuan, dengan menghubungi contact@attentiveid.com.'],
 ['Hasil dari waktu ke waktu','Hasil MHCU Anda dihubungkan dengan email dan nomor WhatsApp yang Anda berikan. Bila Anda mengikuti MHCU lagi di kemudian hari, hasil sebelumnya akan dibandingkan dengan hasil terbaru agar perkembangan Anda dapat dipantau. Gunakan email yang sama setiap kali mengikuti MHCU.'],
 ['Penggunaan untuk penelitian','Dengan persetujuan Anda, data dapat digunakan untuk penelitian akademik, misalnya pengembangan alat ukur psikologis atau pengujian hipotesis, dalam bentuk anonim tanpa nama, email, nomor telepon, atau informasi lain yang dapat mengidentifikasi Anda. Persetujuan penelitian bersifat terpisah dan opsional: menolaknya tidak memengaruhi layanan yang Anda terima. Persetujuan ini dapat ditarik kapan saja; data yang telah dianonimkan dan dianalisis tidak lagi dapat dipisahkan.'],
 ['Hasil, laporan, dan biaya','Setelah mengirim jawaban, Anda akan menerima ringkasan hasil (Mental Health Index dan status keseluruhan) melalui email tanpa biaya. {PRICE} Pastikan email yang Anda gunakan bersifat pribadi, karena hasil dikirim ke alamat tersebut.'],
 ['Peserta di bawah 18 tahun','Peserta yang berusia di bawah 18 tahun hanya dapat mengikuti MHCU dengan sepengetahuan dan persetujuan orang tua atau wali.'],

en: [
 ['Purpose','The Mental Health Check-Up (MHCU) is a screening that gives a general overview of your current mental health. It helps you and the psychologist recognise the areas that are going well and the areas that may need attention or further assessment.'],
 ['Who runs it','The MHCU is run by Attentive Psychology Bureau (Biro Psikologi Attentive). The full report is prepared and signed by an Attentive psychologist officially registered with HIMPSI JAYA, whose name appears on the report.'],
 ['What you will do','You will fill in brief personal details and 58 statements in four parts: psychological symptoms, mental well-being, everyday healthy behaviour, and self-description. It takes about 10-15 minutes. There are no right or wrong answers; please answer honestly, based on your own experience.'],
 ['Nature of the results: screening, not diagnosis','The MHCU is a self-report screening tool. Its results are not a clinical diagnosis and do not replace an assessment by a psychologist, psychiatrist or doctor. The results describe the period assessed and can change over time. The final interpretation is made by a psychologist, taking other information, such as an interview, into account.'],
 ['Voluntary participation and the right to stop','Your participation is entirely voluntary. You may stop at any time before submitting, without giving a reason and without any consequence. Answers that have not been submitted are not stored in our system; your answers in progress are kept only on your own device so they are not lost, and you can delete them with the "Clear answers on this device" link at the bottom of the page.'],
 ['Possible discomfort','Some statements ask about personal matters, such as mood, anxiety, thoughts of hurting yourself, unusual experiences, and the use of alcohol, tobacco or drugs. Answering them may bring up uncomfortable feelings. You may take a break, stop, or contact us to talk to a psychologist.'],
 ['Benefits','You will receive a brief overview of your mental health, follow-up recommendations from a psychologist and, if you take the MHCU more than once, a comparison of your results over time. The MHCU does not guarantee a change in your condition and is not a therapy service.'],
 ['Confidentiality and its limits','All information is kept confidential in accordance with the Indonesian Psychological Code of Ethics. Your identity and answers can only be accessed by authorised Attentive psychologists and administrative staff, for the purpose of your service. Confidentiality has limits: if your answers indicate a possible serious risk to your safety or the safety of others, an Attentive psychologist may contact you directly through the number or email you provided, to make sure you are safe and to offer help. Information is disclosed to others only where required by law or in an emergency to protect life.'],
 ['Data storage and protection','Data are sent over an encrypted connection and stored in Attentive\'s Google Workspace storage with restricted access. Data are kept for as long as needed for your service, for following your results over time and for professional obligations, and are then deleted or anonymised in line with Attentive\'s retention policy. Under Indonesian Law No. 27 of 2022 on Personal Data Protection, you have the right to request access to, correction of or deletion of your data, and to withdraw your consent, by contacting contact@attentiveid.com.'],
 ['Results over time','Your MHCU results are linked to the email and WhatsApp number you provide. If you take the MHCU again in the future, your earlier results are compared with your latest results so that your progress can be followed. Please use the same email each time.'],

  PARTS.forEach(function(p){
    var I = INSTR[p][lg], sc = SCALES[p];
    $('#instr-'+p).innerHTML = '<div class="instr"><div><p class="eyebrow">'+I[0]+'</p><h2>'+I[1]+'</h2><p class="muted" style="margin:0">'+I[2]+'</p></div><div class="period"><small>'+I[3]+'</small><b>'+I[4]+'</b></div></div>';
    $('#th-'+p).textContent = lg==='en' ? 'Statement' : 'Pernyataan';
    $('#lg-'+p).innerHTML = '<b>'+L.legend+':</b> ' + sc[lg].map(function(o,k){ return '<b>'+sc.vals[k]+'</b> '+o[0]; }).join(', ');
  });
  $$('[data-h]').forEach(function(el){ var pk = el.getAttribute('data-h').split('|'), sc = SCALES[pk[0]], o = sc[lg][Number(pk[1])]; el.innerHTML = '<span class="v">'+sc.vals[Number(pk[1])]+'</span>'+o[0]+(o[1]?'<small>'+o[1]+'</small>':''); });
  $$('[data-item]').forEach(function(el){ var c = el.getAttribute('data-item'), it = ITEMS.filter(function(x){ return code(x[0],x[1])===c; })[0]; el.textContent = lg==='en' ? it[3] : it[2]; });
  $$('.mx input').forEach(function(i){ var sc = SCALES[i.name.replace(/\d+$/,'').toLowerCase()]; if (sc) i.setAttribute('aria-label', sc[lg][Number(i.getAttribute('data-k'))][0]); });
  $('#stepper').innerHTML = L.steps.map(function(s,i){ return '<div class="'+(i===S.step?'on':i<S.step?'done':'')+'"><b>'+(i<S.step?'✓':i+1)+'</b><span>'+s+'</span></div>'; }).join('');
  $('#stepper').classList.toggle('hide', S.step===LAST);
  $('#back').textContent = L.back;
  $('#next').innerHTML = S.sending ? '<span class="spinner"></span>'+L.sending : (S.step===0 ? L.start : S.step===1 ? L.agree : S.step===6 ? L.review : S.step===7 ? L.submit : L.next);
  $('#back').style.visibility = S.step>0 && S.step<LAST ? 'visible' : 'hidden';
  $('#nav').classList.toggle('hide', S.step===LAST);
  if (DEMO) $('#demoBar').classList.toggle('hide', S.step===LAST);
  $('#checks').classList.toggle('locked', !S.read);
  if (S.step===7) renderReview();
  if (S.step===LAST && S.done) $('#receipt').innerHTML = '<div><small>'+L.rcp[0]+'</small><b>'+esc(S.done.code)+'</b></div><div><small>'+L.rcp[1]+'</small><b>'+esc(S.done.email)+'</b></div><div><small>'+L.rcp[2]+'</small><b>'+new Date().toLocaleDateString(lg==='en'?'en-GB':'id-ID',{day:'numeric',month:'long',year:'numeric'})+'</b></div>';
  counts();
}
function renderReview(){
  var L = T[S.lang], f = fields();
  $('#rvTable').innerHTML = PARTS.map(function(p,i){ var its = itemsOf(p), a = its.filter(function(it){ return S.ans[code(p,it[1])]!==undefined; }).length;
    return '<tr><td>'+L.partNames[i]+'</td><td class="'+(a===its.length?'okc':'bdc')+'">'+a+' / '+its.length+'</td><td><button type="button" data-go="'+(i+3)+'">'+L.rvEdit+'</button></td></tr>'; }).join('');
  var sexL = f.sex==='other' ? f.sexo : f.sex==='Perempuan (Female)' ? L.female : L.male;
  $('#rvData').innerHTML = [f.name, sexL, f.age, f.phone, f.email, f.research==='full' ? L.rvRes[0] : L.rvRes[1]].map(function(v,i){ return '<dt>'+L.rvLabels[i]+'</dt><dd>'+esc(v||'-')+'</dd>'; }).join('');
  $$('[data-go]').forEach(function(b){ b.onclick = function(){ show(Number(b.getAttribute('data-go'))); }; });
}
function counts(){
  var tot = 58, done = Object.keys(S.ans).length, p = PARTS[S.step-3];
  $('#prog').style.width = (S.step>=LAST ? 100 : Math.round(Math.min(S.step,3)/3*12 + done/tot*85 + (S.step===7?3:0))) + '%';
  if (!p) { $('#count').textContent = S.step===7 ? T[S.lang].answered(done, tot) : ''; return; }
  var its = itemsOf(p), a = its.filter(function(it){ return S.ans[code(p,it[1])]!==undefined; }).length;
  $('#count').textContent = T[S.lang].answered(a, its.length);
}
function hdh(){ document.documentElement.style.setProperty('--hdh', $('.hd').offsetHeight + 'px'); }
function show(step){
  S.step = step;
  $$('section[data-step]').forEach(function(s){ s.classList.toggle('hide', Number(s.getAttribute('data-step'))!==step); });
  render(); store(); hdh();
  window.scrollTo({ top:0, behavior:'smooth' });
  if (step===1) setTimeout(checkRead, 50);
}
function toast(m){ var t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function(){ t.style.display='none'; }, 4500); }
function err(id, on){ var e = $('#err-'+id); if (e) e.classList.toggle('show', !!on); var i = $('#f-'+id); if (i) i.classList.toggle('bad', !!on); return !on; }

/* consent: statements unlock once the document has been read to the end */
function checkRead(){
  var d = $('#icDoc'), r = d.scrollHeight <= d.clientHeight + 4 ? 1 : (d.scrollTop + d.clientHeight) / d.scrollHeight;
  S.readMax = Math.max(S.readMax || 0, S.read ? 1 : r);
  $('#readbar').style.width = Math.min(100, Math.round(S.readMax*100)) + '%';
  if (r >= 0.985 && !S.read) { S.read = true; $('#checks').classList.remove('locked'); store(); }
}
function phoneOk(v){ var d = String(v).replace(/\D/g,''); return d.length>=9 && d.length<=15; }
function validStep(){
  var f = fields(), L = T[S.lang], ok = true;
  if (S.step===1) {
    if (!S.read) { toast(L.icLocked); return false; }
    var need = ['read','screen','limits','age','voluntary'];
    need.forEach(function(v){ var on = f.ack.indexOf(v) < 0; var lb = $('input[name=ack][value='+v+']').closest('.ck'); lb.classList.toggle('miss', on); if (on) ok = false; });
    ['ck-r1','ck-r2'].forEach(function(id){ $('#'+id).classList.toggle('miss', !f.research); });
    if (!f.research) ok = false;
    err('consent', !ok);
  }
  if (S.step===2) {
    ok = err('name', !f.name.trim()) & err('sex', !f.sex || (f.sex==='other' && !f.sexo.trim())) & err('age', !(/^\d{1,3}$/.test(f.age.trim()) && +f.age>=10 && +f.age<=100))
      & err('phone', !phoneOk(f.phone)) & err('email', !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim()));
    if (!ok) { var e = $('.err.show'); if (e) e.scrollIntoView({ behavior:'smooth', block:'center' }); }
  }
  if (S.step>=3 && S.step<=6) {
    var p = PARTS[S.step-3], miss = itemsOf(p).filter(function(it){ return S.ans[code(p,it[1])]===undefined; });
    miss.forEach(function(it){ $('#r_'+code(p,it[1])).classList.add('miss'); });
    if (miss.length) { ok = false; $('#r_'+code(p,miss[0][1])).scrollIntoView({ behavior:'smooth', block:'center' }); toast(L.missing(miss.length)); }
  }
  if (S.step===7) {
    var all = ITEMS.filter(function(it){ return S.ans[code(it[0],it[1])]===undefined; });
    if (all.length) { toast(L.missing(all.length)); return false; }
    ok = $('#finalOk').checked; $('#ck-final').classList.toggle('miss', !ok); err('final', !ok);
  }
  return !!ok;
}
function payload(){
  var f = fields(), raw = {};
  ITEMS.forEach(function(it){ var c = code(it[0],it[1]), v = S.ans[c], sc = SCALES[it[0]], k = sc.vals.indexOf(v); raw[c] = sc.raw ? sc.raw[S.lang][k] : String(v); });
  return { lang:S.lang, consent:f.research, consent_version:CONSENT_VERSION, ack:f.ack, guardian: Number(f.age) < 18,
    name:f.name.trim(), sex: f.sex==='other' ? 'Lainnya: '+f.sexo.trim() : f.sex, age:Number(f.age), phone:f.phone.trim(), email:f.email.trim(),
    answers:S.ans, raw:raw, invite:INV_TOKEN, website:$('#f-website').value, duration_sec: S.t0 ? Math.round((Date.now()-S.t0)/1000) : '' };
}
function submit(){
  if (S.sending) return;
  S.sending = true; $('#next').disabled = true; render();
  var done = function(r){ S.sending = false; $('#next').disabled = false; if (!r || !r.ok) return fail(r && r.error);
    S.done = r; try { localStorage.removeItem('mhcu_draft'); } catch(e){} show(LAST);
    if (DEMO) try { parent.postMessage({ mhcuDemo:'submitted' }, '*'); } catch(e){} };
  var fail = function(m){ S.sending = false; $('#next').disabled = false; render(); toast(m ? String(m).replace(/^Error:\s*/,'') : T[S.lang].netErr); };
  var body = payload();
  if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(done).withFailureHandler(function(e){ fail(e && e.message); }).submitMhcu(body);
  else if (ENDPOINT) fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) }).then(function(r){ return r.json(); }).then(done).catch(function(){ fail(); });
  else setTimeout(function(){ done({ ok:true, code:'AT-MHCU-DEMO', email:body.email }); }, 700); // demo mode (no backend)
}

/* ---------- events ---------- */
$('#next').addEventListener('click', function(){
  if (!validStep()) return;
  if (S.step===1 && !S.t0) S.t0 = Date.now();
  if (S.step===7) return submit();
  show(S.step+1);
});
$('#back').addEventListener('click', function(){ if (S.step>0) show(S.step-1); });
$$('.lang button').forEach(function(b){ b.addEventListener('click', function(){ S.lang = b.getAttribute('data-lang'); render(); store(); hdh(); }); });
$('#icDoc').addEventListener('scroll', checkRead);
$('#clearDraft').addEventListener('click', function(){ if (!confirm(T[S.lang].confirmClear)) return; try { localStorage.removeItem('mhcu_draft'); } catch(e){} location.reload(); });
document.addEventListener('change', function(e){
  var n = e.target.name;
  if (n==='sex') { $('#f-sexo').classList.toggle('hide', e.target.value!=='other'); $$('#sexSeg label').forEach(function(l){ l.classList.toggle('sel', $('input',l).checked); }); err('sex', false); }
  if (n==='ack' || n==='research') { var c = e.target.closest('.ck'); if (c) c.classList.remove('miss'); if (n==='research') $$('#ck-r1,#ck-r2').forEach(function(x){ x.classList.remove('miss'); }); }
  if (e.target.id==='finalOk') { $('#ck-final').classList.remove('miss'); err('final', false); }
  store();
});
document.addEventListener('input', function(e){ if (e.target.classList.contains('t')) { err(e.target.id.replace('f-',''), false); store(); } });
window.addEventListener('resize', hdh);


/* ---------- demo helpers ---------- */
function demoFill(){
  var st = S.step;
  if (st===1) { S.read = true; $('#checks').classList.remove('locked'); $$('input[name=ack]').forEach(function(i){ i.checked = true; }); $('input[name=research][value=full]').checked = true; $('#readbar').style.width = '100%'; }
  if (st===2) { $('#f-name').value = 'Nadia Putri Lestari'; $('#f-age').value = '27'; $('#f-phone').value = '0812 3456 7890'; $('#f-email').value = 'nadia.lestari@example.com';
    var sx = $('input[name=sex][value="Perempuan (Female)"]'); sx.checked = true; $$('#sexSeg label').forEach(function(l){ l.classList.toggle('sel', $('input',l).checked); }); }
  if (st>=3 && st<=6) { var p = PARTS[st-3], sc = SCALES[p];
    itemsOf(p).forEach(function(it){ var c = code(p,it[1]); if (S.ans[c]!==undefined) return;
      var k = p==='cc' ? (it[1]===11 ? 0 : [0,0,1,1,2][Math.floor(Math.random()*5)]) : [1,2,2,3,3,4][Math.floor(Math.random()*6)] % 5;
      var v = sc.vals[Math.min(4,k)], inp = $('input[name='+c+'][value="'+v+'"]'); inp.checked = true; S.ans[c] = v; var tr = inp.closest('tr'); tr.classList.add('ok'); tr.classList.remove('miss'); }); }
  if (st===7) { $('#finalOk').checked = true; }
  $$('.err.show').forEach(function(e){ e.classList.remove('show'); }); $$('.miss').forEach(function(e){ e.classList.remove('miss'); });
  counts(); store();
}
if (DEMO) {
  $('#demoBar').classList.remove('hide');
  var tag = document.createElement('div'); tag.className = 'demo-tag'; tag.textContent = 'MODE DEMO: tidak ada data yang dikirim'; document.body.appendChild(tag);
  $('#demoFill').onclick = demoFill;
  $('#demoSkip').onclick = function(){ demoFill(); if (S.step===0 || validStep()) { if (S.step===7) submit(); else show(S.step+1); } };
}

(function init(){
  buildMatrices();
  var qs = (location.search.match(/[?&]lang=(en|id)/)||[])[1]; if (qs) S.lang = qs;
  try {
    var d = JSON.parse(localStorage.getItem('mhcu_draft')||'null');
    // A draft older than a day (or from an older version of this page) is deleted, not just ignored: it holds name, phone and e-mail.
    if (d && !(d.v===2 && typeof d.ts === 'number' && Date.now() - d.ts < 86400000)) { try { localStorage.removeItem('mhcu_draft'); } catch(e){} d = null; }
    if (d && d.v===2 && typeof d.ts === 'number' && Date.now() - d.ts < 86400000) {
      S.lang = qs || d.lang || S.lang; S.ans = d.ans || {}; S.t0 = d.t0 || null; S.read = !!d.read;
      var f = d.f || {}; ['name','age','phone','email','sexo'].forEach(function(k){ $('#f-'+k).value = f[k] || ''; });
      if (f.sex) { var si = $('input[name=sex][value="'+f.sex+'"]'); if (si) { si.checked = true; si.closest('label').classList.add('sel'); } if (f.sex==='other') $('#f-sexo').classList.remove('hide'); }
      if (f.research) { var ri = $('input[name=research][value="'+f.research+'"]'); if (ri) ri.checked = true; }
      (f.ack||[]).forEach(function(v){ var a = $('input[name=ack][value="'+v+'"]'); if (a) a.checked = true; });
      Object.keys(S.ans).forEach(function(c){ var i = $('input[name='+c+'][value="'+S.ans[c]+'"]'); if (i) { i.checked = true; i.closest('tr').classList.add('ok'); } });
      show(Math.min(d.step||0, 7)); if (Object.keys(S.ans).length || f.name) toast(T[S.lang].resumed); return;
    }
  } catch(e){}
  show(0);
})();
</script>
