<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}

/* Layout: a working desk. Client card and task checklist on the left, the five counselor tasks in order on the right. Attentive paper palette. */
:root{--bg:#faf6ee;--paper:#fffdf8;--sand:#f3ebd9;--line:#e9e0cc;--ink:#2b3346;--mute:#6e6a62;--dim:#8a847a;--gold:#c69a56;--gold-ink:#8a6a35;--logo:#d19d38;--sup:#3f8159;--con:#b5513a;--amb:#5a72a6;--ok:#3f8159;--warn:#b5713a;
 --sans:"Montserrat","Segoe UI",system-ui,sans-serif;--serif:"Source Serif 4",Georgia,serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}p{margin:0}
.top{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:18px 0 14px;border-bottom:1px solid var(--line)}
.top b{color:var(--logo);font-size:19px;letter-spacing:-.02em}.top span{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.top .sp{flex:1}
.grid{max-width:1240px;margin:22px auto 0;display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0}
.k{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink)}
.client h2{font-size:20px;margin:6px 0 2px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px;margin-top:10px}.dl b{font-weight:600;color:var(--mute)}.dl span{overflow-wrap:anywhere}
.tasks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.tasks li a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:600;padding:6px 8px;border-radius:10px}
.tasks li a:hover{background:var(--sand)}
.tasks i{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;font-style:normal;font-size:11px;color:transparent}
.tasks li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.task{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px 24px;scroll-margin-top:16px}
.task>header{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.task>header .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700}
.task.done>header .n{background:var(--ok)}
.task>header h2{font-size:19px}.task>header p{color:var(--mute);font-size:14px;margin-top:2px}
.flags{display:grid;gap:8px}
.flag{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.flag i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ok)}.flag.w i{background:var(--warn)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;padding:6px 0}
.check input{flex:none;width:18px;height:18px;margin-top:2px;accent-color:var(--ink)}
textarea,input[type=text],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
textarea{min-height:110px;resize:vertical;line-height:1.55}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--gold)}

.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}.mapwrap>div,.row2>div{min-width:0}
.map{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}.map svg{display:block;width:100%;height:auto}

.mx td button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:14px;padding:0}
.mx td button[data-v=s]{background:var(--sup);border-color:var(--sup);color:#fff}.mx td button[data-v=c]{background:var(--con);border-color:var(--con);color:#fff}.mx td button[data-v=b]{background:var(--amb);border-color:var(--amb);color:#fff}
.mx td.d{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin-top:8px}.legend i{display:inline-block;width:20px;border-top:3px solid var(--c);vertical-align:middle;margin-right:6px}

.rolelist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:13px}.rolelist span{color:var(--mute)}
.edits{font-size:12.5px;color:var(--warn);margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steps3{display:grid;gap:8px}
.svc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:14.5px;text-decoration:none}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.guide{font-size:14px}.guide ol{margin:6px 0 0;padding-left:20px;display:grid;gap:8px}.guide li b{font-weight:600}.guide li span{color:var(--mute)}
.guide .q{display:block;font-family:var(--serif);font-style:italic;color:var(--ink);margin-top:2px}
details.card summary{cursor:pointer;font-weight:700}
.load{max-width:640px;margin:60px auto;display:flex;flex-direction:column;gap:14px}
.load h1{font-size:28px}.load p{color:var(--mute)}
.need{font-size:13px;color:var(--warn)}
.devk{background:#c58cff;color:#1a0b26;border:1px dashed #6b2fa3;border-radius:999px;padding:8px 14px;font-weight:700;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:9}
@media (max-width:980px){.grid{grid-template-columns:1fr}.side{position:relative;top:0}.mapwrap{grid-template-columns:1fr}}
@media (max-width:560px){.row2,.svc{grid-template-columns:1fr}.task{padding:18px}.top>span:not(#mark):not(.sp):not(#devk){display:none}.devk{padding:7px 10px;font-size:11.5px}}
</style>

<script>
const KCONFIG={DEV:false}; // true = tombol isi otomatis untuk melihat alur (atau buka dengan #dev)
(()=>{'use strict';
/* ===== Goal System Compass · shared core (cards, analysis, packing) ===== */
const $=s=>document.querySelector(s);

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)},eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,eo=t=>1-Math.pow(1-t,3);

/* language: 'id' or 'en' */

work:[['Menyelesaikan tugas atau skripsi yang tertunda','Finish an overdue assignment or thesis'],['Lebih fokus saat kerja atau kuliah','Focus better at work or class'],['Mencari pekerjaan yang lebih cocok','Look for a job that fits me better'],['Naik level atau dapat promosi','Level up or get promoted'],['Menyelesaikan satu proyek sampai tuntas','Finish one project all the way'],['Berani bicara di rapat atau kelas','Speak up in meetings or class'],['Mengurangi menunda-nunda pekerjaan','Procrastinate less at work'],['Membangun usaha sampingan','Build a side business'],['Punya batas jelas antara kerja dan istirahat','Keep a clear line between work and rest']],
money:[['Punya tabungan darurat','Build an emergency fund'],['Melunasi utang atau cicilan','Pay off a debt or installment'],['Mencatat pengeluaran','Track my spending'],['Mengurangi belanja impulsif','Cut impulse spending'],['Punya penghasilan tambahan','Earn some extra income'],['Membantu keuangan keluarga','Help my family financially'],['Menabung untuk sesuatu yang kuinginkan','Save for something I want'],['Mulai belajar investasi','Start learning to invest'],['Merasa lebih tenang soal uang','Feel calmer about money']],
body:[['Tidur lebih teratur','Sleep on a more regular schedule'],['Bergerak atau olahraga rutin','Move or exercise regularly'],['Makan lebih teratur dan bergizi','Eat more regularly and well'],['Minum air lebih banyak','Drink more water'],['Mengurangi rokok, kopi, atau gula','Cut down on smoking, coffee, or sugar'],['Memeriksakan kesehatan yang tertunda','Get the check-up I keep postponing'],['Keluar rumah dan kena matahari tiap hari','Get outside in the sun every day'],['Punya energi yang lebih stabil','Have steadier energy'],['Merawat sakit yang sedang kujalani','Take care of an illness I live with']],
mind:[['Merasa lebih tenang sehari-hari','Feel calmer day to day'],['Mengurangi waktu scrolling','Spend less time scrolling'],['Mencari bantuan profesional untuk perasaanku','Seek professional help for how I feel'],['Lebih baik pada diri sendiri','Be kinder to myself'],['Mengenali apa yang sebenarnya kuinginkan','Figure out what I actually want'],['Menulis jurnal atau merenung rutin','Journal or reflect regularly'],['Pulih dari kejadian yang berat','Recover from something hard'],['Lebih percaya diri','Feel more confident'],['Punya satu hal yang kutunggu-tunggu tiap minggu','Have one thing to look forward to each week']],
family:[['Lebih dekat dengan orang tua','Grow closer to my parents'],['Meluangkan waktu untuk keluarga','Make time for family'],['Memperbaiki hubungan dengan anggota keluarga','Repair things with a family member'],['Merawat anggota keluarga yang sakit','Care for a family member who is ill'],['Jadi orang tua yang lebih sabar','Be a more patient parent'],['Membuat keluarga bangga','Make my family proud'],['Lebih sering menghubungi saudara','Reach out to my siblings more'],['Menyiapkan masa depan anak','Prepare for my children’s future'],['Mandiri dari orang tua','Become independent from my parents']],

home:[['Merapikan kamar atau rumah','Tidy my room or home'],['Punya rutinitas pagi','Have a morning routine'],['Memasak sendiri lebih sering','Cook for myself more often'],['Pindah ke tempat tinggal yang lebih baik','Move to a better place to live'],['Menyelesaikan urusan administrasi','Sort out paperwork and admin'],['Mengatur jadwal mingguan','Plan my week'],['Memperbaiki barang yang rusak','Fix something that’s broken'],['Membuat rumah lebih nyaman','Make home more comfortable'],['Bangun lebih pagi','Wake up earlier']],
play:[['Kembali ke hobi lama','Go back to an old hobby'],['Mencoba hobi baru','Try a new hobby'],['Membaca buku sampai selesai','Finish reading a book'],['Membuat sesuatu dengan tanganku','Make something with my hands'],['Bermain musik atau bernyanyi','Play music or sing'],['Menggambar, menulis, atau berkarya','Draw, write, or create something'],['Menonton atau main game tanpa rasa bersalah','Watch or game without guilt'],['Jalan-jalan ke tempat baru di kotaku','Explore a new place in my city'],['Punya waktu santai yang benar-benar santai','Have downtime that is truly restful']],
learn:[['Belajar bahasa baru','Learn a new language'],['Mengikuti kursus atau pelatihan','Take a course or training'],['Belajar keterampilan untuk kerja','Learn a skill for work'],['Melanjutkan sekolah','Continue my education'],['Belajar menyetir atau keterampilan praktis','Learn to drive or another practical skill'],['Membaca lebih banyak','Read more'],['Lebih disiplin','Be more disciplined'],['Mengatur waktu lebih baik','Manage my time better'],['Mengasah bakat yang kupunya','Develop a talent I have']],
faith:[['Lebih rutin beribadah','Pray or worship more regularly'],['Mendalami keyakinanku','Deepen my faith'],['Mencari makna dari yang sedang kujalani','Find meaning in what I’m going through'],['Hidup sesuai nilai-nilaiku','Live by my values'],['Lebih bersyukur','Be more grateful'],['Berdamai dengan masa lalu','Make peace with the past'],['Punya waktu hening untuk diri sendiri','Have quiet time for myself'],['Memaafkan seseorang','Forgive someone'],['Mencari tahu apa yang penting buatku','Find out what matters to me']],
give:[['Membantu orang di sekitarku','Help the people around me'],['Ikut kegiatan sukarela','Volunteer'],['Aktif di komunitas','Be active in a community'],['Berbagi ilmu atau keahlian','Share what I know'],['Merawat hewan atau tanaman','Care for an animal or plants'],['Lebih peduli lingkungan','Care more for the environment'],['Jadi tempat bercerita bagi orang lain','Be someone others can talk to'],['Bersedekah atau berdonasi rutin','Give or donate regularly'],['Membimbing adik atau junior','Mentor someone younger']],
plans:[['Merencanakan hidupku 5 tahun lagi','Plan where I want to be in 5 years'],['Pindah kota atau ke luar negeri','Move to another city or country'],['Merencanakan pernikahan','Plan a wedding'],['Merencanakan perjalanan','Plan a trip'],['Memutuskan jurusan atau karier','Decide on a major or career'],['Punya rumah sendiri','Own a home'],['Menyiapkan dana pensiun','Prepare for retirement'],['Mewujudkan satu mimpi yang lama tertunda','Reach a long-postponed dream'],['Mengambil keputusan besar yang tertunda','Make a big decision I keep putting off']]};

const CARD={};AREAS.forEach(a=>CARDS[a[0]].forEach((c,i)=>{CARD[a[0]+i]={id:a[0]+i,area:a[0],get text(){return LANG==='en'?c[1]:c[0]}}}));
const areaName=a=>{const x=AREAS.find(z=>z[0]===a);return x?x[LANG==='en'?2:1]:tr('Ditulis sendiri','Written by you')};
const PROGL=()=>LANG==='en'?[['Not lived yet','Not yet'],['Partly lived','Partly'],['Fully lived','Fully']]:[['Belum terwujud','Belum'],['Sebagian terwujud','Sebagian'],['Sudah terwujud','Terwujud']];
const REL={s:'Mendukung',c:'Menghambat',b:'Mendukung'};

/* data model shared by the participant page, the backend and the counselor console
   goals: [{id,name,area,src,rank,prog}]  rank 1 = most important · rel: {"a>b":"s"|"c"|"b"} */
function importance(goals){const n=goals.length,o={};goals.forEach(g=>{o[g.id]=n<=1?10:Math.round(10-7*(g.rank-1)/(n-1))});return o}
function analyze(data){const gs=[...data.goals].sort((a,b)=>a.rank-b.rank),ids=new Set(gs.map(g=>g.id)),imp=importance(gs),E=[];
 Object.entries(data.rel||{}).forEach(([k,v])=>{const [a,b]=k.split('>');if(ids.has(a)&&ids.has(b)&&v&&v!=='0')E.push({k,a,b,v})});
 const D={};gs.forEach(g=>D[g.id]={sOut:0,sIn:0,cOut:0,cIn:0});E.forEach(e=>{const s=e.v!=='c',c=e.v!=='s';if(s){D[e.a].sOut++;D[e.b].sIn++}if(c){D[e.a].cOut++;D[e.b].cIn++}});
 const has=(a,b,v)=>E.some(e=>e.a===a&&e.b===b&&e.v===v),mutual=[];for(let i=0;i<gs.length;i++)for(let j=i+1;j<gs.length;j++){const a=gs[i].id,b=gs[j].id;if(has(a,b,'s')&&has(b,a,'s'))mutual.push([a,b])}
 const iso=gs.filter(g=>!E.some(e=>e.a===g.id||e.b===g.id)).map(g=>g.id);
 const lever=[...gs].filter(g=>D[g.id].sOut>=2).sort((a,b)=>(D[b.id].sOut-D[a.id].sOut)||(imp[b.id]-imp[a.id]))[0]||null;
 const recip=e=>E.some(x=>x.a===e.b&&x.b===e.a&&x.v!=='s');const pc=E.filter(e=>e.v!=='s').map(e=>({e,s:imp[e.a]+imp[e.b]+(recip(e)?2:0)+(e.v==='c'?1:0)})).sort((a,b)=>b.s-a.s)[0];
 const groups=communities(gs.map(g=>g.id),E).filter(c=>c.length>=2);
 /* spiral: the league winner is the core. Layer 1 = values that make the core easier, layer 2 = values that make layer 1 easier, and so on.
    Values with no supporting path to the core stay outside ("not connected yet"). */
 const SPI=spiral(gs,E,D);
 const cent=gs.map((g,i)=>{const d=D[g.id];return {id:g.id,name:g.name,rank:i+1,lay:SPI.lay[g.id]??null,sz:SPI.sz[g.id]||1,S:d.sIn+d.sOut,H:d.cIn+d.cOut}}).sort((a,b)=>((a.lay??99)-(b.lay??99))||(b.sz-a.sz)||(a.rank-b.rank));cent.forEach((x,i)=>x.pos=i+1);
 return {gs,n:gs.length,imp,E,D,cent,...SPI,mutual,iso,lever,pressure:pc?pc.e:null,groups,ns:E.filter(e=>e.v==='s').length,nc:E.filter(e=>e.v==='c').length,nb:E.filter(e=>e.v==='b').length,cells:gs.length*(gs.length-1)}}
/* breadth-first from the core along "makes easier" links, read inward (x>t means x makes t easier) */
function spiral(gs,E,D){const core=gs[0]?gs[0].id:null,lay={},par={},order=[],kids={};gs.forEach(g=>kids[g.id]=[]);if(!core)return {core,lay,par,order,kids,sz:{},unc:[],maxL:0,tree:[],out:[],route:[]};
 const sup=new Set(E.filter(e=>e.v!=='c').map(e=>e.k));lay[core]=0;const q=[core];
 while(q.length){const t=q.shift();order.push(t);gs.forEach(g=>{const x=g.id;if(lay[x]!=null)return;if(sup.has(x+'>'+t)){lay[x]=lay[t]+1;par[x]=t;kids[t].push(x);q.push(x)}})}
 const sz={},szf=id=>sz[id]=1+kids[id].reduce((s,k)=>s+szf(k),0);szf(core);
 const unc=gs.filter(g=>lay[g.id]==null).map(g=>g.id),maxL=Math.max(0,...Object.values(lay));
 // outward: everything the core makes easier, directly or through others
 const out=[],seen=new Set([core]),fq=[core];while(fq.length){const a=fq.shift();gs.forEach(g=>{if(!seen.has(g.id)&&sup.has(a+'>'+g.id)){seen.add(g.id);out.push(g.id);fq.push(g.id)}})}
 // the route in: follow the biggest branch from the core out to its edge, then read it back inward
 const best=arr=>arr.slice().sort((a,b)=>(sz[b]-sz[a])||(D[b].sOut-D[a].sOut))[0];const path=[];let c=best(kids[core]);while(c){path.push(c);c=best(kids[c])}

async function dl(blob,name){try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return}}}catch(e){}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
