    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalBusiness",
      "name": "Attentive.id",
      "url": "https://attentiveid.com",
      "logo": "https://attentiveid.com/images/figma/attentive-logo.webp",
      "image": "https://attentiveid.com/images/og-attentive.jpg",
      "description": "Layanan biro psikologi dan konseling kesehatan mental profesional online dan tatap muka di Jakarta, BSD, dan Malang.",
      "telephone": "+628121808608",
      "priceRange": "IDR 475,000",
      "medicalSpecialty": "Psychiatric",
      "availableService": [
        {
          "@type": "MedicalTherapy",
          "name": "Konseling Psikologi Dewasa"
        },
        {
          "@type": "MedicalTherapy",
          "name": "Konseling Anak & Remaja"
        },
        {
          "@type": "MedicalTherapy",
          "name": "Konseling Pasangan & Keluarga"
        },
        {
          "@type": "MedicalTest",
          "name": "Asesmen Psikologi & Minat Bakat"
        }
      ],
      "areaServed": [
        {
          "@type": "City",
          "name": "Jakarta"
        },
        {
          "@type": "City",
          "name": "Tangerang Selatan"
        },
        {
          "@type": "City",
          "name": "Malang"
        }
      ]
    }
    </script>
    <script>
      const pathname = window.location.pathname.replace(/\/$/, '') || '/'
      const psychologistSlugs = new Set(['syazka', 'gita', 'mayda', 'anggun', 'dinda', 'ilham', 'nichi', 'dewinta', 'sekar', 'kia', 'disa'])
      const profileMatch = pathname.match(/^\/psychologists\/([a-z0-9-]+)$/)
      const profileSlug = profileMatch?.[1]
      const imageHref = pathname === '/'
        ? '/images/figma/consultation-hero.webp'
        : profileSlug && psychologistSlugs.has(profileSlug)
          ? `/images/psychologists/${profileSlug.charAt(0).toUpperCase()}${profileSlug.slice(1)}.webp`
          : null

      if (imageHref) {
        const imagePreload = document.createElement('link')
        imagePreload.rel = 'preload'
        imagePreload.as = 'image'
        imagePreload.href = imageHref
        imagePreload.fetchPriority = 'high'
        document.head.append(imagePreload)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
